services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: minesweeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: minesweeper
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minesweeper"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      # Persist the bot UUID mapping across container rebuilds. The bot
      # registry hard-fails if this file is missing, so seed_elo (run from
      # entrypoint.sh when BOTS_ENABLED=1) must create it before gunicorn
      # starts.
      BOT_USER_IDS_PATH: /var/lib/minesweeper/bot_state/user_ids.json
    volumes:
      - bot_state:/var/lib/minesweeper/bot_state
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  bot_state:
